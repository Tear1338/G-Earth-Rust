[package]
name = "gearth-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Work-in-progress Rust port of G-Realm/G-Earth 1.5.4-beta-29"

[features]
default = []
desktop = ["dep:eframe"]

[dependencies]
getrandom = "0.3.4"
serde_json = "1.0"
num-bigint = "0.4"
hkdf = "0.12"
sha2 = "0.10"
chacha20 = "0.9"
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "gearth-rust"
path = "src/main.rs"

[[bin]]
name = "gearth-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

