[package]
name = "gearth-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Work-in-progress Rust port of G-Realm/G-Earth 1.5.4-beta-29"

[features]
default = []
desktop = ["dep:eframe"]

[dependencies]
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "gearth-rust"
path = "src/main.rs"

[[bin]]
name = "gearth-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

