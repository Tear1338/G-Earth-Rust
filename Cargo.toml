[package]
name = "gearth-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Work-in-progress Rust port of G-Realm/G-Earth 1.5.4-beta-29"

[features]
default = []
desktop = ["dep:eframe", "web"]
web = ["dep:hudsucker", "dep:tokio-rustls", "dep:md-5", "dep:des", "dep:cbc", "dep:png", "dep:aes", "dep:aes-gcm", "dep:ctr", "dep:wasmparser", "dep:wasm-encoder", "dep:flate2"]

[dependencies]
gearth-platform = { path = "crates/gearth-platform" }
getrandom = "0.3.4"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
num-bigint = "0.4"
hkdf = "0.12"
sha2 = "0.10"
chacha20 = "0.9"
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
hudsucker = { version = "=0.25.0", path = "crates/hudsucker", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", optional = true }
tower-service = "0.3"
url = "2"
wasmparser = { version = "=0.240.0", optional = true }
wasm-encoder = { version = "=0.240.0", optional = true, features = ["wasmparser"] }
flate2 = { version = "1", optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
ctr = { version = "0.9", optional = true }
des = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true, features = ["alloc"] }
png = { version = "0.17", optional = true }
http-body-util = "0.1"
md-5 = { version = "0.10", optional = true }
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "gearth-rust"
path = "src/main.rs"

[[bin]]
name = "gearth-benchmark"
path = "tools/benchmark.rs"

[[bin]]
name = "gearth-flash-fixture"
path = "tools/flash_fixture.rs"

[[bin]]
name = "gearth-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["crates/gearth-platform"]
exclude = ["crates/hudsucker"]
resolver = "2"


[dev-dependencies]
rcgen = "0.14"
tokio-rustls = "0.26"
wat = "=1.240.0"
