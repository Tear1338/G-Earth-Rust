name: Rust validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
        timeout-minutes: 6
      - name: Test Windows global shortcut registration and delivery
        if: matrix.os == 'windows-latest'
        run: cargo test --locked -p gearth-platform --lib windows_hotkey_message_roundtrip -- --ignored
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --bin gearth-rust
      - uses: actions/upload-artifact@v4
        with:
          name: gearth-cli-${{ matrix.os }}
          path: |
            target/release/gearth-rust
            target/release/gearth-rust.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: formatted-source-and-lockfile
          path: |
            Cargo.lock
            Cargo.toml
            LICENSE
            LICENSE-APACHE-MAVEN
            NOTICE-APACHE-MAVEN
            resources/
            src/
            tests/
            tools/
            crates/
  desktop:
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --features desktop --bin gearth-desktop -- -D warnings
      - run: cargo test --locked --features desktop --bin gearth-desktop logger_prediction_tests
      - run: cargo test --locked --features desktop --bin gearth-desktop rule_editor_tests
      - run: cargo test --locked --features desktop --bin gearth-desktop socks_settings_tests
      - run: cargo test --locked --features desktop --bin gearth-desktop window_icon_tests
      - run: cargo build --locked --release --features desktop --bin gearth-desktop
      - run: python tools/check_pe_imports.py target/release/gearth-desktop.exe
      - run: python tools/check_pe_icon.py target/release/gearth-desktop.exe
      - name: Package desktop usage and license
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -LiteralPath target/release/gearth-desktop.exe -Destination package/gearth-desktop.exe
          Copy-Item -LiteralPath README.md,LICENSE,LICENSE-APACHE-MAVEN,NOTICE-APACHE-MAVEN -Destination package
          Copy-Item -LiteralPath docs -Destination package/docs -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: G-Earth-Rust-Windows-development
          path: package/
  java-compatibility:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - name: Download the pinned upstream release
        run: |
          curl --fail --location --retry 3 'https://github.com/G-Realm/G-Earth/releases/download/1.5.4-beta-29/G-Earth-windows-x64.zip' -o /tmp/gearth.zip
          echo 'c2bffcf8ef8e9df6b2355fe6c5f45690bc24b7211f9848728209e0a9b2b4a6e6  /tmp/gearth.zip' | sha256sum --check
          unzip -q /tmp/gearth.zip -d /tmp/upstream-gearth
      - name: Generate vectors with the actual Java implementation
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          test -n "$api_jar"
          bcprov=$(find /tmp/upstream-gearth -name 'bcprov-*.jar' -print -quit)
          mkdir -p /tmp/original-crypto /tmp/original-classes
          for source in BobbaCrypto BobbaChaChaKey BobbaCryptoUtils; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/gearth/app/protocol/crypto/$source.java" -o "/tmp/original-crypto/$source.java"
          done
          javac -cp "$bcprov" -d /tmp/original-classes /tmp/original-crypto/*.java
          javac -cp "$api_jar:$bcprov:/tmp/original-classes" tests/JavaOracle.java tests/JavaExtensionFixture.java tests/JavaOriginsExtensionFixture.java tests/BobbaOracle.java
          java -cp "$api_jar:tests" JavaOracle > /tmp/java-oracle.txt
          java -cp "$bcprov:/tmp/original-classes:tests" BobbaOracle >> /tmp/java-oracle.txt
          cat /tmp/java-oracle.txt
          echo "GEARTH_EXTENSION_CLASSPATH=$api_jar:tests" >> "$GITHUB_ENV"
      - name: Compare Rust output byte for byte
        run: cargo test --locked --test oracle -- --ignored
        env:
          GEARTH_JAVA_ORACLE: /tmp/java-oracle.txt
      - name: Compare furniture state formats against the original Java API
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          javac -cp "$api_jar" tests/JavaStuffOracle.java
          java -cp "$api_jar:tests" JavaStuffOracle > /tmp/stuff-oracle.txt
          cargo test --locked --test stuffdata_oracle -- --ignored
        env:
          GEARTH_STUFF_ORACLE: /tmp/stuff-oracle.txt
      - name: Compare room entities and friend updates against Java
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          test -n "$api_jar"
          javac -cp "$api_jar" tests/JavaEntityConstructOracle.java tests/JavaFriendUpdateOracle.java tests/JavaEntityUpdateOracle.java tests/JavaDoubleFormatOracle.java tests/JavaHeightPacketOracle.java
          java -cp "$api_jar:tests" JavaEntityConstructOracle > /tmp/entity-oracle.txt
          java -cp "$api_jar:tests" JavaEntityUpdateOracle > /tmp/entity-update-oracle.txt
          java -cp tests JavaDoubleFormatOracle > /tmp/double-format-oracle.txt
          java -cp "$api_jar:tests" JavaHeightPacketOracle > /tmp/height-packet-oracle.txt
          java -cp "$api_jar:tests" JavaFriendUpdateOracle > /tmp/friend-oracle.txt
          cargo test --locked --test room_social_oracle -- --ignored
        env:
          GEARTH_ENTITY_ORACLE: /tmp/entity-oracle.txt
          GEARTH_ENTITY_UPDATE_ORACLE: /tmp/entity-update-oracle.txt
          GEARTH_DOUBLE_FORMAT_ORACLE: /tmp/double-format-oracle.txt
          GEARTH_HEIGHT_PACKET_ORACLE: /tmp/height-packet-oracle.txt
          GEARTH_FRIEND_ORACLE: /tmp/friend-oracle.txt
      - name: Compare structure prediction against the original Java API
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          javac -cp "$api_jar" tests/JavaPredictionOracle.java
          java -cp "$api_jar:tests" JavaPredictionOracle > /tmp/prediction-oracle.txt
          cargo test --locked --test prediction_oracle -- --ignored
        env:
          GEARTH_PREDICTION_ORACLE: /tmp/prediction-oracle.txt
      - name: Compare packet mutations against the original Java API
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          test -n "$api_jar"
          javac -encoding UTF-8 -cp "$api_jar" tests/JavaMutationOracle.java
          java -cp "$api_jar:tests" JavaMutationOracle > /tmp/mutation-oracle.txt
          cargo test --locked --test mutation_oracle -- --ignored
          cargo test --locked --lib unicode_latin1_case_pairs_match_java -- --ignored
          cargo test --locked --lib unicode_latin1_classes_match_java -- --ignored
          javac -encoding UTF-8 tests/JavaRegexPropertyGenerator.java
          java -cp tests JavaRegexPropertyGenerator --oracle > /tmp/regex-property-oracle.txt
          GEARTH_REGEX_PROPERTY_ORACLE=/tmp/regex-property-oracle.txt cargo test --locked --lib java_property_tables_match_java -- --ignored
          java -cp tests JavaRegexPropertyGenerator --names > /tmp/regex-property-names-oracle.txt
          GEARTH_REGEX_PROPERTY_NAMES_ORACLE=/tmp/regex-property-names-oracle.txt cargo test --locked --lib java_unicode_property_names_match_java -- --ignored
        env:
          GEARTH_MUTATION_ORACLE: /tmp/mutation-oracle.txt
      - name: Compare Flash identification against pinned Java source
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          test -n "$api_jar"
          mkdir -p /tmp/flash-source /tmp/flash-classes
          for source in OutgoingFlashPacketHandler OnDatastreamConfirmedListener; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/gearth/app/protocol/packethandler/flash/$source.java" -o "/tmp/flash-source/$source.java"
          done
          javac -encoding UTF-8 -cp "$api_jar" -d /tmp/flash-classes $(find tests/java_flash -name '*.java') /tmp/flash-source/*.java
          java -cp "$api_jar:/tmp/flash-classes" JavaFlashIdentityOracle > /tmp/flash-identity-oracle.txt
          cargo test --locked --test flash identification_compares_with_java -- --ignored
        env:
          GEARTH_FLASH_IDENTITY_ORACLE: /tmp/flash-identity-oracle.txt
      - name: Compare extension versions against the original Maven library
        run: |
          maven_jar=$(find /tmp/upstream-gearth -name 'maven-artifact-*.jar' -print -quit)
          test -n "$maven_jar"
          javac -cp "$maven_jar" tests/JavaMavenOracle.java
          java -cp "$maven_jar:tests" JavaMavenOracle > /tmp/maven-oracle.txt
          cargo test --locked --test maven_oracle -- --ignored
        env:
          GEARTH_MAVEN_ORACLE: /tmp/maven-oracle.txt
      - name: Compare scheduler files against the original Java serializer
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          test -n "$api_jar"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/openjfx/javafx-base/21.0.2/javafx-base-21.0.2-linux.jar' -o /tmp/javafx-base.jar
          mkdir -p /tmp/scheduler-src /tmp/scheduler-classes
          for source in gearth/app/services/scheduler/ScheduleItem.java gearth/app/services/scheduler/Interval.java gearth/app/ui/subforms/scheduler/InteractableScheduleItem.java gearth/app/services/scheduler/listeners/OnBeingUpdatedListener.java gearth/app/services/scheduler/listeners/OnDeleteListener.java gearth/app/services/scheduler/listeners/OnEditListener.java gearth/app/services/scheduler/listeners/OnUpdatedListener.java; do
            mkdir -p "/tmp/scheduler-src/$(dirname "$source")"
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/$source" -o "/tmp/scheduler-src/$source"
          done
          javac -cp "$api_jar:/tmp/javafx-base.jar" -d /tmp/scheduler-classes $(find /tmp/scheduler-src -name '*.java') tests/java_schedule/gearth/app/ui/subforms/scheduler/SchedulerController.java tests/java_schedule/JavaScheduleOracle.java tests/java_schedule/JavaSchedulePacketOracle.java
          java -cp "$api_jar:/tmp/javafx-base.jar:/tmp/scheduler-classes" JavaScheduleOracle > /tmp/schedule-oracle.txt
          export GEARTH_SCHEDULE_PACKET_CLASSPATH="$api_jar:/tmp/scheduler-classes"
          cargo test --locked --test schedule_file -- --ignored
        env:
          GEARTH_SCHEDULE_ORACLE: /tmp/schedule-oracle.txt
      - name: Compare packet hex dumps with the original Java logger
        run: |
          mkdir -p /tmp/hexdump-classes
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/gearth/app/services/internal_extensions/uilogger/hexdumper/Hexdump.java' -o /tmp/Hexdump.java
          javac -d /tmp/hexdump-classes /tmp/Hexdump.java tests/JavaHexdumpOracle.java
          cargo test --locked --test logger_display hex_dump_matches_original_java -- --ignored
        env:
          GEARTH_HEXDUMP_CLASSPATH: /tmp/hexdump-classes
      - name: Exercise an actual beta-29 Java extension against Rust
        run: cargo test --locked --features web --test java_extension -- --ignored
      - name: Exercise an actual beta-29 Java extension through encrypted Origins relay
        run: cargo test --locked --features web --lib origins_relay_interoperates_with_actual_java_extension -- --ignored
      - name: Exercise the original Java extension through Unity
        run: cargo test --locked --features web --test java_unity_extension -- --ignored
      - name: Validate store launch and original catalogue
        env:
          GEARTH_STORE_CONFIG: /tmp/store-config.json
          GEARTH_STORE_EXTENSIONS: /tmp/store-extensions.json
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/sirjonasxx/G-ExtensionStore/e1d69194395c038bd1ee6a34239fbb45bb424e97/store/config.json' -o /tmp/store-config.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/sirjonasxx/G-ExtensionStore/e1d69194395c038bd1ee6a34239fbb45bb424e97/.auto-generated/extensions.json' -o /tmp/store-extensions.json
          cargo test --locked --test extension_store -- --ignored
          cargo test --locked --test java_store_command -- --ignored
      - name: Validate hotel crypto against Java JCE
        run: |
          javac tests/JavaNitroCryptoOracle.java
          java -cp tests JavaNitroCryptoOracle > /tmp/nitro-crypto-oracle.txt
          cargo test --locked --features web --lib java_crypto -- --ignored
        env:
          GEARTH_NITRO_CRYPTO_ORACLE: /tmp/nitro-crypto-oracle.txt
      - name: Compare Unity hooks with the released Java patcher
        env:
          GEARTH_UNITY_FIXTURE_DIR: /tmp/gearth-unity-java
        run: |
          gwasm=$(find /tmp/upstream-gearth -name 'G-Wasm-Minimal-*.jar' -print -quit)
          test -n "$gwasm"
          echo "81ede388f652652b5a7dd66cb111c3bdfb0526fd03ffa688fe8f8ea56c91e748  $gwasm" | sha256sum --check
          mkdir -p /tmp/original-unity-source /tmp/original-unity-classes
          for source in WasmCodePatcher UnityWebModifierException; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/gearth/app/services/unity_tools/$source.java" -o "/tmp/original-unity-source/$source.java"
          done
          for source in SalsaSetKeyPatcher SalsaReturnBytePatcher OutgoingPacketPatcher IncomingPacketPatcher; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/gearth/app/services/unity_tools/codepatcher/$source.java" -o "/tmp/original-unity-source/$source.java"
          done
          for source in IncomingPacketPatcherDebug OutgoingPacketPatcherDebug; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/G-Realm/G-Earth/242155c291b1109d6c9a02370f6a2af1ead41ea8/G-Earth/src/main/java/gearth/app/services/unity_tools/codepatcher/debug/$source.java" -o "/tmp/original-unity-source/$source.java"
          done
          javac -cp "$gwasm" -d /tmp/original-unity-classes /tmp/original-unity-source/*.java tests/JavaUnityWasmOracle.java
          cargo test --locked --features web --test unity_wasm patches_all_four_hooks -- --nocapture
          java -cp "$gwasm:/tmp/original-unity-classes" JavaUnityWasmOracle "$GEARTH_UNITY_FIXTURE_DIR/oracle-original.wasm" "$GEARTH_UNITY_FIXTURE_DIR/java-patched.wasm"
          node tests/unity_wasm_runtime.mjs "$GEARTH_UNITY_FIXTURE_DIR" rust-oracle-patched.wasm java-patched.wasm
      - name: Compare finite packet-construction throughput
        run: |
          api_jar=$(find /tmp/upstream-gearth -name 'G-Earth-Api-1.5.4-beta-29.jar' -print -quit)
          javac -cp "$api_jar" tests/JavaBenchmark.java
          cargo build --locked --release --bin gearth-benchmark
          java -Xms256m -Xmx256m -cp "$api_jar:tests" JavaBenchmark > java-benchmark.csv
          target/release/gearth-benchmark > rust-benchmark.csv
          cat java-benchmark.csv rust-benchmark.csv
      - uses: actions/upload-artifact@v4
        with:
          name: packet-microbenchmark
          path: '*-benchmark.csv'
  publish-development:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build]')
    needs: [core, desktop, java-compatibility, web, gpython, gpresets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish tested development downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: development-${{ github.run_number }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          cd artifacts/formatted-source-and-lockfile
          zip -qr ../../formatted-source-and-lockfile.zip .
          cd ../..
          cp artifacts/G-Earth-Rust-Windows-development/gearth-desktop.exe G-Earth-Rust-Windows.exe
          cp artifacts/gearth-cli-windows-latest/gearth-rust.exe G-Earth-Rust-CLI-Windows.exe
          cp artifacts/gearth-cli-ubuntu-latest/gearth-rust gearth-cli-linux
          cp artifacts/packet-microbenchmark/*-benchmark.csv .
          sha256sum G-Earth-Rust-Windows.exe G-Earth-Rust-CLI-Windows.exe gearth-cli-linux formatted-source-and-lockfile.zip > SHA256SUMS.txt
          printf '%s\n' 'Development build of the incomplete Rust port. Read docs/PARITY.md before use. This is not a complete replacement for G-Earth beta-29; real client/firewall validation, Chrome TLS emulation and exact UI parity remain outstanding. No performance superiority has been established.' > release-notes.txt
          gh release create "$BUILD_TAG" --target "$BUILD_COMMIT" --title "Rust development build $BUILD_TAG" --prerelease --notes-file release-notes.txt G-Earth-Rust-Windows.exe G-Earth-Rust-CLI-Windows.exe gearth-cli-linux formatted-source-and-lockfile.zip SHA256SUMS.txt java-benchmark.csv rust-benchmark.csv

  web:
    env:
      GEARTH_UNITY_FIXTURE_DIR: /tmp/gearth-unity-fixtures
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --features web --all-targets -- --nocapture
        timeout-minutes: 8
      - run: cargo test --locked --features web --test unity_browser -- --ignored --nocapture
      - run: node tests/unity_wasm_runtime.mjs "$GEARTH_UNITY_FIXTURE_DIR"
      - run: cargo clippy --locked --features web --all-targets -- -D warnings

  gpresets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - name: Download pinned released G-Presets and JavaFX runtime
        run: |
          curl --fail --location --retry 3 'https://github.com/Tear1338/G-Presets/releases/download/v1.6.5/GPresets-1.6.5.jar' -o /tmp/GPresets-1.6.5.jar
          echo 'd2bd67422b131e17a5033762a3fc7e015f5a6581f6e2d3c4abb6b414a711ddb3  /tmp/GPresets-1.6.5.jar' | sha256sum --check
          mkdir -p /tmp/javafx
          for module in base graphics controls fxml media web swing; do
            curl --fail --location --retry 3 "https://repo.maven.apache.org/maven2/org/openjfx/javafx-$module/21.0.2/javafx-$module-21.0.2-linux.jar" -o "/tmp/javafx/javafx-$module.jar"
          done
      - name: Start the real extension in an isolated virtual display
        run: xvfb-run -a cargo test --locked --test gpresets_compatibility -- --ignored --nocapture
        env:
          GEARTH_GPRESETS_JAR: /tmp/GPresets-1.6.5.jar
          GEARTH_JAVAFX_MODULES: /tmp/javafx

  gpython:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r tests/gpython-requirements.txt'
      - run: python -m pip install ipykernel jupyter-client qtconsole PyQt5 jupyter-console psutil
      - name: Verify manual extension console output
        run: cargo test --locked --lib manual_python_launch_captures_stdout_and_stderr -- --ignored
        env:
          GEARTH_TEST_PYTHON: python
      - run: cargo test --locked --test gpython -- --ignored --nocapture --test-threads=1
