### Alert - client Flash macOS
alert.macosflash.title=Préparer Habbo pour l'interception Flash
alert.macosflash.content=G-Earth doit préparer le client Habbo Flash installé afin de lire l'état du chiffrement tout en gardant la protection de l'intégrité du système activée.\n\
                         \n\
                         Cette opération ne nécessite pas de droits d'administrateur, mais désactive Hardened Runtime pour Habbo. L'application d'origine sera sauvegardée à côté de Habbo.\n\
                         \n\
                         Fermez Habbo avant de continuer. Appliquer cette modification ?
alert.macosflash.running=Habbo est en cours d'exécution. Fermez-le et réessayez de vous connecter.
alert.macosflash.failed=G-Earth n'a pas pu préparer Habbo. Vérifiez que Habbo est installé et fermé. Si macOS a bloqué la modification, autorisez G-Earth dans Réglages Système > Confidentialité et sécurité > Gestion des apps, puis réessayez.

