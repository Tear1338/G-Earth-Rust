                         \n\
                         Esto no requiere permisos de administrador, pero desactiva Hardened Runtime para Habbo. Se guardará una copia de la aplicación original junto a Habbo.\n\
                         \n\
                         Cierra Habbo antes de continuar. ¿Aplicar este cambio?
