### Alert - client Flash macOS
alert.macosflash.title=Prepara Habbo per l'intercettazione Flash
alert.macosflash.content=G-Earth deve preparare il client Habbo Flash installato per leggere lo stato della crittografia mantenendo attiva la Protezione integrità di sistema.\n\
                         \n\
                         Questa operazione non richiede diritti di amministratore, ma disabilita Hardened Runtime per Habbo. Verrà salvata una copia dell'app originale accanto a Habbo.\n\
                         \n\
                         Chiudi Habbo prima di continuare. Applicare questa modifica?
alert.macosflash.running=Habbo è attualmente in esecuzione. Chiudilo e prova a connetterti di nuovo.
alert.macosflash.failed=G-Earth non ha potuto preparare Habbo. Assicurati che Habbo sia installato e chiuso. Se macOS ha bloccato la modifica, consenti G-Earth in Impostazioni di Sistema > Privacy e sicurezza > Gestione app, quindi riprova.

### Alert - helper privilegiato macOS
alert.macoshelper.title=Installa l'helper privilegiato di G-Earth
alert.macoshelper.install=G-Earth deve installare un piccolo helper privilegiato per gestire la rete di macOS.\n\
                          \n\
                          G-Earth continuerà a funzionare senza privilegi di amministratore. Installare ora l'helper?
