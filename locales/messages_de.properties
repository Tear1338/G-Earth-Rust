### Alert - macOS Flash-Client
alert.macosflash.title=Habbo für die Flash-Überwachung vorbereiten
alert.macosflash.content=G-Earth muss den installierten Habbo Flash-Client vorbereiten, um den Verschlüsselungsstatus bei aktiviertem Systemintegritätsschutz lesen zu können.\n\
                         \n\
                         Dafür sind keine Administratorrechte erforderlich, aber die Hardened Runtime wird für Habbo deaktiviert. Die ursprüngliche App wird neben Habbo gesichert.\n\
                         \n\
                         Schließe Habbo, bevor du fortfährst. Änderung anwenden?
alert.macosflash.running=Habbo läuft gerade. Schließe es und versuche erneut, eine Verbindung herzustellen.
alert.macosflash.failed=G-Earth konnte Habbo nicht vorbereiten. Stelle sicher, dass Habbo installiert und geschlossen ist. Falls macOS die Änderung blockiert hat, erlaube G-Earth unter Systemeinstellungen > Datenschutz & Sicherheit > App-Verwaltung und versuche es erneut.

### Alert - privilegierter macOS-Helfer
alert.macoshelper.title=Privilegierten G-Earth-Helfer installieren
alert.macoshelper.install=G-Earth muss einen kleinen privilegierten Helfer installieren, der die macOS-Netzwerkeinstellungen verwaltet.\n\
                          \n\
                          G-Earth selbst läuft weiterhin ohne Administratorrechte. Helfer jetzt installieren?
alert.macoshelper.update=Der mitgelieferte privilegierte G-Earth-Helfer wurde geändert und muss vor dem Fortfahren aktualisiert werden. Jetzt aktualisieren?
alert.macoshelper.failed=G-Earth konnte den privilegierten Helfer nicht installieren oder erreichen.

