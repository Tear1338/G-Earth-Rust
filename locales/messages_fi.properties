alert.macosflash.failed=G-Earth ei voinut valmistella Habboa. Varmista, että Habbo on asennettu ja suljettu. Jos macOS esti muutoksen, salli G-Earth kohdassa Järjestelmäasetukset > Tietosuoja ja suojaus > Appien hallinta ja yritä uudelleen.

