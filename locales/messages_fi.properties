alert.macosflash.title=Valmistele Habbo Flash-liikenteen sieppausta varten
alert.macosflash.content=G-Earthin täytyy valmistella asennettu Habbo Flash -asiakas, jotta se voi lukea salauksen tilan järjestelmän eheyden suojauksen ollessa käytössä.\n\
                         \n\
                         Tämä ei vaadi järjestelmänvalvojan oikeuksia, mutta poistaa Hardened Runtimen käytöstä Habbolta. Alkuperäinen sovellus varmuuskopioidaan Habbon viereen.\n\
                         \n\
                         Sulje Habbo ennen jatkamista. Otetaanko muutos käyttöön?
