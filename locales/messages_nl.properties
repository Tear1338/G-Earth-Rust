### Alert - macOS Flash-client
alert.macosflash.title=Habbo voorbereiden op Flash-interceptie
alert.macosflash.content=G-Earth moet de geïnstalleerde Habbo Flash-client voorbereiden om de versleutelingsstatus te kunnen lezen terwijl System Integrity Protection ingeschakeld blijft.\n\
                         \n\
                         Hiervoor zijn geen beheerdersrechten nodig, maar Hardened Runtime wordt voor Habbo uitgeschakeld. Er wordt naast Habbo een back-up van de originele app gemaakt.\n\
                         \n\
                         Sluit Habbo voordat je doorgaat. Deze wijziging toepassen?
alert.macosflash.running=Habbo is momenteel actief. Sluit het en probeer opnieuw verbinding te maken.
alert.macosflash.failed=G-Earth kon Habbo niet voorbereiden. Controleer of Habbo is geïnstalleerd en afgesloten. Als macOS de wijziging heeft geblokkeerd, sta G-Earth dan toe via Systeeminstellingen > Privacy en beveiliging > Appbeheer en probeer het opnieuw.

